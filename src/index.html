<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIH 26023 | Evidence-Governed Reporting</title>
<style>
  :root{--ink:#14221d;--muted:#53635a;--green:#176044;--green-soft:#e7f2eb;--line:#d8e0db;--surface:#fff;--canvas:#f3f6f5;--amber:#8d3b18;--amber-soft:#fff3e9}
  *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:32px 20px 56px}header{border-left:6px solid #2e7155;padding-left:16px}h1{margin:0;font-size:28px;line-height:1.2}h2{margin:0 0 14px;font-size:18px}p{margin:10px 0}.query{display:flex;gap:10px;margin:26px 0}input{flex:1;min-width:0;padding:13px;border:1px solid #b8c6bf;border-radius:6px;font:inherit}button{background:var(--green);color:#fff;border:0;border-radius:6px;padding:0 20px;font-weight:700;cursor:pointer}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0;box-shadow:0 1px 2px #14221d08}.state{border-left:5px solid var(--green)}.state.warn{border-left-color:var(--amber);background:#fffdfb}.eyebrow,.label{margin:0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.answer-card{border-color:#a9cfb9;background:linear-gradient(135deg,#fff 0%,#f4faf6 100%)}.answer-value{margin:4px 0 2px;font-size:clamp(32px,6vw,54px);font-weight:800;letter-spacing:-.045em;line-height:1.05}.answer-status,.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;letter-spacing:.04em}.answer-status{background:var(--green);color:#fff}.source-line{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}.source-line strong{display:block;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.record{border:1px solid var(--line);border-top:4px solid #6f9c87;border-radius:7px;background:#f8faf9;padding:14px}.record-title{display:flex;align-items:start;justify-content:space-between;gap:8px}.record-value{font-size:22px;font-weight:800;line-height:1.15}.record p{font-size:14px}.badge{background:var(--green-soft);color:var(--green);white-space:nowrap}.derived{border-color:#d89a5e;background:var(--amber-soft)}.derived .badge{background:#f8ddc5;color:#78300f}.reconciliation{border-left:5px solid #2e7155}.consistent{background:var(--green);color:#fff;font-size:14px}.meta{color:var(--muted);font-size:13px}.meta strong{color:var(--ink)}small{color:var(--muted)}code{white-space:pre-wrap}details{margin-top:14px}summary{cursor:pointer;font-weight:600}@media(max-width:560px){.wrap{padding:24px 14px}.query{flex-direction:column}button{min-height:44px}.card{padding:16px}}
</style>
<body><main class="wrap">
  <header><h1>Evidence-Governed Reporting Intelligence</h1><p>CMPDI/CIL reporting MVP · verified evidence only · derived values are visibly labeled</p></header>
  <form class="query" id="form"><input id="question" aria-label="Reporting question" value="How much raw coal did MCL produce in 2023-24?" required><button>Ask</button></form>
  <div id="result" aria-live="polite"></div>
</main>
<script>
const esc=s=>String(s??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const method=r=>r.mining_method==='OC'?'Open Cast':r.mining_method==='UG'?'Underground':r.mining_method||'Reported evidence';
const rec=r=>`<article class="record"><div class="record-title"><div><div class="label">${esc(method(r))}</div><div class="record-value">${esc(r.value)} ${esc(r.unit)}</div></div><span class="badge">${esc(r.status)}</span></div><p>${esc(r.entity)} · ${esc(r.metric)} · ${esc(r.period)} · ${esc(r.coal_type)}</p><p><strong>${esc(r.source_document)}</strong><br>Page ${esc(r.page)}, ${esc(r.table)} · ${esc(r.source_location)}</p><div class="meta"><strong>Evidence ID:</strong> ${esc(r.evidence_id)}<br><strong>Extraction:</strong> ${esc(r.extraction_method)}</div></article>`;
const query=d=>`<details><summary>Interpreted query</summary><code>${esc(JSON.stringify(d.query,null,2))}</code></details>`;
const state=d=>`<section class="card state ${d.status==='answered'?'':'warn'}"><div class="eyebrow">${d.status==='insufficient_evidence'?'Evidence state':d.status==='needs_clarification'?'Query state':'Answer state'}</div><div class="${d.status==='answered'?'badge':'badge derived'}">${esc(d.status.replaceAll('_',' '))}</div><p>${esc(d.message)}</p>${query(d)}</section>`;
const answer=d=>{const primary=d.evidence.find(r=>r.status==='reported')||d.calculation;return `<section class="card answer-card"><div class="eyebrow">Verified answer</div><div class="answer-value">${esc(primary.value)} ${esc(primary.unit)}</div><span class="answer-status">DIRECTLY REPORTED</span><div class="source-line"><div class="label">Primary source</div><strong>${esc(primary.source_document)}</strong><span class="meta">Page ${esc(primary.page)} · ${esc(primary.table)} · Evidence ID: ${esc(primary.evidence_id)}</span></div><p>${esc(d.message)}</p>${query(d)}</section>`};
const calculation=d=>`<section class="card derived"><h2>Deterministic calculation / provenance</h2><span class="badge">DERIVED — NOT DIRECTLY REPORTED</span><p><strong>${esc(d.calculation.calculation.expression)} ${esc(d.calculation.unit)}</strong></p><p class="meta">Inputs: ${d.calculation.calculation.input_evidence_ids.map(esc).join(', ')}</p><div class="grid">${d.calculation.components.map(rec).join('')}</div></section>`;
const reconciliation=d=>`<section class="card reconciliation"><h2>Cross-source reconciliation</h2>${d.reconciliation.map(x=>`<p><span class="badge ${x.status==='consistent'?'consistent':''}">${esc(x.status)}</span> <strong>${esc(x.reason)}</strong><br><span class="meta">Scope: ${esc(x.scope)}</span></p>`).join('')}</section>`;
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#result');out.innerHTML='<p>Retrieving verified evidence…</p>';const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:question.value})});const d=await r.json();let h=d.status==='answered'?answer(d):state(d);if(d.calculation)h+=calculation(d);if(d.reconciliation?.length)h+=reconciliation(d);if(d.evidence?.length)h+=`<section class="card"><h2>Retrieved reported evidence</h2><div class="grid">${d.evidence.map(rec).join('')}</div></section>`;out.innerHTML=h};
</script></body></html>
